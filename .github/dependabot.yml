version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime dependency bumps change what users install, so they cut a
    # patch release; dev-only bumps do not.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    # OpenTelemetry JS packages pin their siblings exactly, and each
    # experimental 0.x release pairs with one stable 2.x release. Bumped one
    # at a time they nest duplicate copies, so they move together.
    # @ai-sdk/otel pins `ai` exactly for the same reason.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
    # Each @types/node major types APIs that the oldest Node in `engines`
    # may lack, so its major moves by hand, alongside `engines`.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript and tsup majors change the toolchain (tsup 9 failed CI on
      # Node 18 with ERR_REQUIRE_ESM; TypeScript 7 failed lint and packaging),
      # so they are planned by hand rather than taken as routine bumps.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tsup"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry JS 3.x requires @opentelemetry/api 1.10, while the
      # OpenInference instrumentations and @ai-sdk/otel still require api
      # below 1.10, and raising our api peer would break users in a patch
      # release. 0.300 is the experimental line paired with 3.x, so a
      # semver-major ignore alone would still let it through.
      - dependency-name: "@opentelemetry/*"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/*"
        versions: [">=0.300.0 <1.0.0"]
