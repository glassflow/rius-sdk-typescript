version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime dependency bumps change what users install, so they cut a
    # patch release; dev-only bumps do not.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    # OpenTelemetry JS packages pin their siblings exactly, and each
    # experimental 0.x release pairs with one stable 2.x release. Bumped one
    # at a time they nest duplicate copies, so they move together.
    # @ai-sdk/otel pins `ai` exactly for the same reason.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
    # Each @types/node major types APIs that the oldest Node in `engines`
    # may lack, so its major moves by hand, alongside `engines`.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript and tsup majors change the toolchain (tsup 9 drops Node 18,
      # TypeScript 7 breaks the build and lint tooling), so they are planned by
      # hand rather than taken as routine bumps.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tsup"
        update-types: ["version-update:semver-major"]
