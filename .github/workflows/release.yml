name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check whether @glassflow/rius exists on npm yet
        id: npm_preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          if npm view @glassflow/rius version >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          if [ "$exists" = "false" ] && [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::@glassflow/rius has never been published to npm. npm trusted publishing cannot be linked to a package that does not exist yet. Publish 0.1.0 once manually, or set an NPM_TOKEN secret for this first release, then re-run."
            exit 1
          fi
          if [ "$exists" = "false" ]; then
            echo "::warning::@glassflow/rius does not exist on npm yet; publishing this first release with NPM_TOKEN instead of OIDC trusted publishing. Link npm trusted publishing after this release and remove NPM_TOKEN."
            echo "use_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (OIDC trusted publishing)
        if: steps.npm_preflight.outputs.use_token != 'true'
        run: npm publish --provenance --access public
      - name: Publish (NPM_TOKEN fallback for first release)
        if: steps.npm_preflight.outputs.use_token == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  dispatch-docs:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify glassflow-docs
        env:
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::DOCS_DISPATCH_TOKEN not configured; docs not notified for ${TAG}"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/glassflow/glassflow-docs/dispatches \
            -d "$(jq -n --arg v "$TAG" '{event_type:"sdk-release",client_payload:{sdk:"typescript",version:$v}}')"

  notify:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_RELEASES not configured; no release announcement for ${TAG}"
            exit 0
          fi
          jq -n --arg t "$TAG" '{text:(":package: *@glassflow/rius \($t)* published to npm")}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK"
