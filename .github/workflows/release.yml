name: Release

on:
  push:
    branches: [main]
  # Recovery path: release-please tags a version once, so a publish that fails
  # after the tag exists (the 0.2.0 npm-CLI failure) cannot be retried by any
  # push. Dispatching runs the publish job against main's current version; the
  # preflight below skips it when that version is already on the registry, so
  # running this when nothing is pending is harmless.
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm 11.5.1 or newer. Node 20 ships npm
      # 10, whose publish sends no registry credential at all: it still signs
      # provenance, then fails with "404 Not Found - PUT .../@glassflow-ai%2frius",
      # which reads like a missing package rather than a missing credential.
      # That cost the 0.2.0 release. Pin the CLI, not the Node version, so the
      # publish job keeps testing on the same Node as the rest of CI.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: npm publish preflight
        id: npm_preflight
        run: |
          set -uo pipefail
          # Idempotency: if THIS exact version is already on the registry —
          # the bootstrap 0.1.0 published manually because npm trusted
          # publishing cannot be linked to a package that does not exist yet,
          # or a re-run of a partly-failed release — skip the publish step
          # rather than fail on the duplicate. The tag, GitHub release, docs
          # dispatch and Slack notification are still wanted.
          version=$(node -p "require('./package.json').version")
          if npm view "@glassflow-ai/rius@${version}" version >/dev/null 2>&1; then
            echo "::notice::@glassflow-ai/rius@${version} is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if ! npm view @glassflow-ai/rius version >/dev/null 2>&1; then
            echo "::error::@glassflow-ai/rius has never been published to npm, and OIDC trusted publishing cannot be linked to a package that does not exist yet. Bootstrap once by hand — npm login && npm publish --access public — then link trusted publishing (repo glassflow/rius-sdk-typescript, workflow release.yml, environment npm) and re-run this workflow; the preflight above will then skip the duplicate publish."
            exit 1
          fi
      - name: Publish (OIDC trusted publishing)
        if: steps.npm_preflight.outputs.skip != 'true'
        run: npm publish --provenance --access public

  dispatch-docs:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify glassflow-docs
        env:
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::DOCS_DISPATCH_TOKEN not configured; docs not notified for ${TAG}"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/glassflow/glassflow-docs/dispatches \
            -d "$(jq -n --arg v "$TAG" '{event_type:"sdk-release",client_payload:{sdk:"typescript",version:$v}}')"

  notify:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_RELEASES not configured; no release announcement for ${TAG}"
            exit 0
          fi
          jq -n --arg t "$TAG" '{text:(":package: *@glassflow-ai/rius \($t)* published to npm")}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK"
